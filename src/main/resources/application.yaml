spring:
  application:
    name: langchain4j-demo
  ai:
    mcp:
      server:
        name: langchain4j-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
        streamable-http:
          endpoint: /mcp

server:
  port: 8088

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: qwen2.5:3b
      temperature: 0.7
    embedding-model:
      base-url: http://localhost:11434
      model-name: nomic-embed-text

  pgvector:
    host: localhost
    port: 5432
    database: postgres
    user: postgres
    password: 123456
    table: vector_store_langchain
    dimension: 768

searxng:
  base-url: http://localhost:8888

router:
  tool-timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: langchain4j-demo
